name: Validate Garmin watch contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node motion and relay contract tests
        run: npm test
      - name: Validate Connect IQ manifest and resources
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          for f in ("manifest.xml", "resources/properties.xml",
                    "resources/strings.xml", "resources/settings.xml"):
              ET.parse(f)
          ns = "{http://www.garmin.com/xml/connectiq}"
          app = ET.parse("manifest.xml").getroot().find(ns+"application")
          assert app is not None and app.attrib.get("minApiLevel") == "3.1.0"
          assert any(p.attrib.get("id") == "fenix5s"
                     for p in app.find(ns+"products"))
          cfg = json.load(open("upstream.json"))
          assert cfg["watch"]["device"] == "fenix5s"
          PY
