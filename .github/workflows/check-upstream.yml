name: Check upstream openGym releases
on:
  schedule:
    - cron: "29 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: upstream-opengym-watch
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check upstream release and open a compatibility issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess, urllib.request
          cfg = json.load(open("upstream.json", encoding="utf-8"))
          baseline = cfg["lastReviewedRelease"]
          req = urllib.request.Request(
              "https://api.github.com/repos/DuarteSantos8/openGym/releases/latest",
              headers={"Accept": "application/vnd.github+json",
                       "User-Agent": "opengym-garmin-upstream-watch"})
          with urllib.request.urlopen(req, timeout=25) as response:
              release = json.load(response)
          tag = release["tag_name"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?", tag):
              raise SystemExit("Unrecognized tag; no issue created")
          if tag == baseline:
              print("No newer release than reviewed baseline:", baseline)
              raise SystemExit(0)
          title = f"Review openGym {tag} for Garmin compatibility"
          issues = json.loads(subprocess.run(
              ["gh", "issue", "list", "--state", "all", "--limit", "100",
               "--search", f"{title} in:title", "--json", "title"],
              capture_output=True, text=True, check=True).stdout)
          if any(issue["title"] == title for issue in issues):
              print("Review issue already exists:", title)
              raise SystemExit(0)
          body = (
              f"Upstream: {release['html_url']}\n"
              f"Last reviewed release: {baseline}\n\n"
              "Check watch-relay API, watch-sync.js event application, Garmin code, "
              "scoped pairing, setDone semantics, offline queue, heart-rate data, "
              "and the original fēnix 5S / Connect IQ 3.1 compatibility. "
              "Prepare a tested pull request if changes are needed. "
              "Never auto-merge. Update upstream.json only after source review. "
              "Node tests do not prove physical-watch compatibility.")
          subprocess.run(
              ["gh", "issue", "create", "--title", title, "--body", body],
              check=True)
          PY
